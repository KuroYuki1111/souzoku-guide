name: Auto-merge Atlas PRs
on:
  pull_request:
    branches: [ "staging" ]
jobs:
  automerge:
    if: contains(github.event.pull_request.head.ref, 'atlas/fix-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Auto-merge
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: ""
          MERGE_METHOD: squash
          MERGE_DELETE_BRANCH: "true"
